services:
  mysql:
    ports: !reset []

  ai-service:
    ports: !reset []
    environment:
      APP_ENVIRONMENT: production
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: https://${VISAFY_DOMAIN},http://backend:8080

  backend:
    ports: !reset []
    environment:
      DB_PASSWORD: ${MYSQL_PASSWORD}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      SPRING_SECURITY_USER_NAME: ${ADMIN_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://${VISAFY_DOMAIN}

  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${VISAFY_DOMAIN}
        NEXT_PUBLIC_DEFAULT_LANGUAGE: ${NEXT_PUBLIC_DEFAULT_LANGUAGE:-ko}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      VISAFY_DOMAIN: ${VISAFY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:

