name: ssafin-preflight

services:
  ai-service:
    environment:
      LLM_PROVIDER: none
      OPENAI_API_KEY: ""
      CORS_ALLOWED_ORIGINS: https://localhost:8443,http://backend:8080

  backend:
    environment:
      CORS_ALLOWED_ORIGINS: https://localhost:8443

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://localhost:8443

  caddy:
    environment:
      VISAFY_DOMAIN: localhost
    ports: !override
      - "8088:80"
      - "8443:443"
      - "8443:443/udp"
