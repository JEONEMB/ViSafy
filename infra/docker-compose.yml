name: visafy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-visafy}
      MYSQL_USER: ${MYSQL_USER:-visafy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-visafy}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: ../ai-service
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENVIRONMENT: local
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-none}
      OCR_API_KEY: ${OCR_API_KEY:-}
      VECTOR_DB_PATH: /data/chroma
      ALLOWED_SOURCE_DOMAINS: ${SOURCE_ALLOWED_DOMAINS:-kbstar.com,kebhana.com,hanabank.com,shinhan.com,kbsec.com,wooribank.com,ibk.co.kr,nhbank.com,kdb.co.kr,sc.co.kr,citibank.co.kr,kakaobank.com,kbanknow.com,tossbank.com,fss.or.kr,fsc.go.kr,finlife.fss.or.kr}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-local-rag-development-token}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://backend:8080
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data/chroma
      - embedding-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-visafy}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER:-visafy}
      DB_PASSWORD: ${MYSQL_PASSWORD:-visafy}
      AI_SERVICE_URL: http://ai-service:8000
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-local-rag-development-token}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-local-development-only-secret}
      ADMIN_SECURITY_ENABLED: ${ADMIN_SECURITY_ENABLED:-true}
      SPRING_SECURITY_USER_NAME: ${ADMIN_USERNAME:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-enabling-admin-security}
      SOURCE_ALLOWED_DOMAINS: ${SOURCE_ALLOWED_DOMAINS:-kbstar.com,kebhana.com,hanabank.com,shinhan.com,kbsec.com,wooribank.com,ibk.co.kr,nhbank.com,kdb.co.kr,sc.co.kr,citibank.co.kr,kakaobank.com,kbanknow.com,tossbank.com,fss.or.kr,fsc.go.kr,finlife.fss.or.kr}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_DEFAULT_LANGUAGE: ${NEXT_PUBLIC_DEFAULT_LANGUAGE:-ko}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  chroma-data:
  embedding-model-cache:
