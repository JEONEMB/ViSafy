server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: visafy-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/visafy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:visafy}
    password: ${DB_PASSWORD:visafy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

app:
  admin-jwt-secret: ${ADMIN_JWT_SECRET:local-development-only-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

