name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/ssafin-frontend.log 2>&1 &
      - run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:3000 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ssafin-frontend.log
          exit 1
      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  integration:
    needs: [frontend, frontend-e2e, backend, ai-service, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all services
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker compose up --build --detach --wait --wait-timeout 240; then
              exit 0
            fi
            echo "Compose startup failed (attempt ${attempt}/3)"
            docker compose logs --no-color || true
            docker compose down --volumes || true
            sleep 10
          done
          exit 1
      - name: Verify health endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/api/health/ai
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:3000/health
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes
